name: Staging CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  # Render khong tu deploy nua (autoDeployTrigger: off). Repo con chi bump con
  # tro submodule trong superrepo; superrepo moi goi Render deploy hook.
  bump-superrepo:
    name: Bump superrepo submodule
    needs: backend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Push new submodule pointer
        env:
          PAT: ${{ secrets.DEPLOY_PAT }}
          SHA: ${{ github.sha }}
          SUB: backend
        run: |
          set -euo pipefail
          if [ -z "$PAT" ]; then echo "Thieu secret DEPLOY_PAT"; exit 1; fi
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PAT" | base64 -w0)"
          url=https://github.com/PNV-do-an/AI-Interview-Platform-deploy-staging.git
          for try in 1 2 3; do
            rm -rf /tmp/super
            git clone --quiet "$url" /tmp/super
            git -C /tmp/super update-index --add --replace --cacheinfo 160000,"$SHA","$SUB"
            if git -C /tmp/super diff --cached --quiet; then
              echo "superrepo dang tro dung $SHA, khong bump"; exit 0
            fi
            git -C /tmp/super commit -q -m "chore(deploy): $SUB -> $SHA"
            if git -C /tmp/super push --quiet origin HEAD:dev; then
              echo "da bump $SUB -> $SHA"; exit 0
            fi
            echo "push bi conflict, thu lan $try"; sleep 5
          done
          echo "khong bump duoc sau 3 lan"; exit 1
