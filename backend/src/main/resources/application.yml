spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_interview_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    # Tắt Open Session In View: lazy loading ngoài transaction sẽ fail ngay khi dev,
    # thay vì âm thầm chạy SQL trong lúc serialize response.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:noreply@aiinterview.com}
    password: ${MAIL_PASSWORD:}
    test-connection: ${MAIL_TEST_CONNECTION:true}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000
    refresh-expiration: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI Configuration
ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-4o-mini}
  eval-model: ${AI_EVAL_MODEL:gpt-4o-mini}
  whisper-model: whisper-1
  tts-model: tts-1
  tts-voice: alloy
  max-tokens: 4096
  temperature: 0.3

# File Storage
storage:
  cv-upload-dir: ${CV_UPLOAD_DIR:./uploads/cv}
  audio-upload-dir: ${AUDIO_UPLOAD_DIR:./uploads/audio}
  max-file-size: 10MB
  allowed-file-types: application/pdf,text/plain

# Interview Defaults
interview:
  default-question-count: 20
  max-question-count: 100
  min-question-count: 5
  default-time-limit-minutes: 60
  difficulty-distribution:
    beginner: 20
    intermediate: 50
    advanced: 30

# Study Program
study:
  max-topics-per-program: 10
  questions-per-topic: 10
  auto-generate-on-cv-upload: true