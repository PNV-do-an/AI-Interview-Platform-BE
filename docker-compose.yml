version: "3.8"

services:
  ai-service:
    build: .
    ports:
      - "8020:8020"
    environment:
      - AI_AVATAR_SERVER=http://livetalking:8010
      - AI_AVATAR_ID=vn_interviewer_v1
      - AI_STT_MODEL=small
      - AI_STT_DEVICE=cpu
      - AI_STT_COMPUTE=int8
      - AI_MAX_TURNS=40
      - AI_RUBRIC_VERSION=2026-10-v1
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
      - ./vendored/LiveTalking/models:/app/vendored/LiveTalking/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  livetalking:
    image: doubiiu/livetalking:v1
    ports:
      - "8010:8010"
    volumes:
      - ./assets:/app/data/avatars
      - ./config:/app/config
      - ./vendored/LiveTalking/models:/app/models/wav2lip
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_NAME=ai_interview_db
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-123456}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
