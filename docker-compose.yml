services:
  # ── MySQL database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: ai_interview_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ai_interview_db}
      MYSQL_USER: ${DB_USERNAME:-aiuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aipassword}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ai_interview_network

  # ── Backend (Spring Boot) ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interview_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-ai_interview_db}
      DB_USERNAME: ${DB_USERNAME:-aiuser}
      DB_PASSWORD: ${DB_PASSWORD:-aipassword}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@aiinterview.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_TEST_CONNECTION: ${MAIL_TEST_CONNECTION:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_EVAL_MODEL: ${AI_EVAL_MODEL:-gpt-4o-mini}
      CV_UPLOAD_DIR: ${CV_UPLOAD_DIR:-./uploads/cv}
      AUDIO_UPLOAD_DIR: ${AUDIO_UPLOAD_DIR:-./uploads/audio}
    ports:
      - "8080:8080"
    networks:
      - ai_interview_network

  # ── Frontend (React + Nginx) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_interview_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - ai_interview_network

networks:
  ai_interview_network:
    driver: bridge

volumes:
  mysql_data:
    name: ai_interview_compose_mysql_data