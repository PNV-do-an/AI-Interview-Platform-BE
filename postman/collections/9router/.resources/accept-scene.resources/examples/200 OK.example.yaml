$kind: http-example
name: '200 OK'
request:
  method: POST
  url: 'http://localhost:8080/api/scripts/7/review'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "sceneId": 2,
        "action": "reject",
        "comment": "......."
      }
