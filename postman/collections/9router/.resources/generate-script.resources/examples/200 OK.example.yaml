$kind: http-example
name: '200 OK'
request:
  method: POST
  url: 'http://localhost:8080/api/scripts/import/from-text'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "content": "Tôi làm video ngắn về cách xây nhà, mô tả ngắn gọn",
        "title": "XÂY NHÀ TRONG 5S"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: content-type
      value: application/json
  body:
    type: json
    content: |-
      {
        "projectId": "10",
        "sceneCount": 3,
        "scenes": []
      }
