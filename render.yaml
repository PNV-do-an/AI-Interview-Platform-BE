services:
  - type: web
    name: ai-interview-backend-staging
    runtime: docker
    plan: free
    region: singapore
    branch: dev
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/v1/packages
    # Superrepo (repo deploy-staging) la noi phat dong deploy backend qua
    # deploy hook, nen Render khong tu build theo commit nua.
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8080"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: "https://aiinterview-vn.vercel.app"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        value: "699111427837-pk58qfj8g5dgjr703r21ki79o2d9lqdd.apps.googleusercontent.com"
      - key: GITHUB_CLIENT_ID
        value: "Ov23liAxCHIj9EZrkmMk"
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # OpenAiClient doc ai.api-key = ${OPENAI_API_KEY:} trong application.yml.
      # sync: false = Render hoi gia tri trong dashboard, khong commit key vao repo.
      - key: OPENAI_API_KEY
        sync: false
      # payOS: return/cancel phải trỏ về BACKEND public, không được là localhost.
      # App tự fallback về RENDER_EXTERNAL_URL nếu các biến dưới bị thiếu.
      - key: APP_PUBLIC_BASE_URL
        value: "https://ai-interview-backend-staging.onrender.com"
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_BASE_URL
        value: "https://api-merchant.payos.vn"
      - key: PAYOS_RETURN_URL
        value: "https://ai-interview-backend-staging.onrender.com/api/v1/payment/payos/return"
      - key: PAYOS_CANCEL_URL
        value: "https://ai-interview-backend-staging.onrender.com/api/v1/payment/payos/cancel"
