spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_interview_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

# Nền tảng PaaS (Render, container...) truyền cổng nghe qua env PORT; mặc định 8080
server:
  port: ${PORT:8080}

app:
  mail:
    # Resend HTTP API - thay SMTP de khoi phu thuoc port 25/587 (xem spec/features/registration-email.md)
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:onboarding@resend.dev}
    resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000
    refresh-expiration: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}