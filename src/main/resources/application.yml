spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_interview_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

# Nền tảng PaaS (Render, container...) truyền cổng nghe qua env PORT; mặc định 8080
server:
  port: ${PORT:8080}

app:
  mail:
    # Gmail API qua HTTPS: Render free tier chặn SMTP 25/465/587, Resend test mode chỉ giao
    # thư cho chủ tài khoản (xem spec/features/registration-email.md)
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
    # MAIL_FROM phải đúng là hộp thư đã cấp refresh token (Gmail không cho spoof From qua API)
    from: ${MAIL_FROM:}
    token-uri: ${GMAIL_TOKEN_URI:https://oauth2.googleapis.com/token}
    api-base-url: ${GMAIL_API_BASE_URL:https://gmail.googleapis.com}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000
    refresh-expiration: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Cào JD IT TopCV bằng một nút bấm: URL danh sách mặc định + giới hạn mỗi lần.
  # Có thể override bằng env khi deploy. Proxy/cookie dùng khi TopCV chặn IP server.
  topcv:
    it-listing-url: ${TOPCV_IT_LISTING_URL:https://www.topcv.vn/tim-viec-lam-cong-nghe-thong-tin-cr257?type_keyword=1&disable_auto_detect_type_keyword=1&sba=1&category_family=r257&saturday_status=0}
    default-limit: ${TOPCV_IMPORT_LIMIT:20}
    proxy-url: ${TOPCV_PROXY_URL:}
    cookie: ${TOPCV_COOKIE:}
    user-agent: ${TOPCV_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36}
  # FR-SCH-03: nhắc lịch phỏng vấn. Mặc định tắt vì job gửi Gmail thật; bật bằng
  # INTERVIEW_REMINDER_ENABLED=true. window-minutes phải khớp nhịp cron bên dưới.
  interview-reminder:
    enabled: ${INTERVIEW_REMINDER_ENABLED:false}
    cron: ${INTERVIEW_REMINDER_CRON:0 */15 * * * *}
    window-minutes: ${INTERVIEW_REMINDER_WINDOW_MINUTES:15}
    lead-minutes: ${INTERVIEW_REMINDER_LEAD_MINUTES:60}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}