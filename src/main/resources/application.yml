spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_interview_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    # Tắt Open Session In View: lazy loading ngoài transaction sẽ fail ngay khi dev,
    # thay vì âm thầm chạy SQL trong lúc serialize response.
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false
  # SMTP: đường gửi mail chính (Gmail App Password). Bật bằng cách đặt MAIL_USERNAME +
  # MAIL_PASSWORD; bỏ trống thì EmailServiceImpl rơi về Gmail API. Host để rỗng chứ không
  # mặc định smtp.gmail.com: để rỗng thì JavaMailSender không được tạo và không ai gửi nhầm
  # bằng credential của người khác.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      # Timeout ngắn: Gmail SMTP treo thì register phải fail sau vài giây, không giữ
      # request của user đến hết timeout mặc định (vô hạn với socket read).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Nền tảng PaaS (Render, container...) truyền cổng nghe qua env PORT; mặc định 8080
server:
  port: ${PORT:8080}

app:
  # Tài khoản test đã xác thực sẵn cho Postman. Luồng register thật cần Gmail API
  # (thiếu GMAIL_* thì EmailServiceImpl ném lỗi và transaction rollback -> 502),
  # nên chỉ bật ở stack local/docker, production để false.
  seed:
    test-accounts: ${APP_SEED_TEST_ACCOUNTS:false}
    test-password: ${APP_SEED_TEST_PASSWORD:Test@12345}
  mail:
    # Bật để chạy luồng register/reset khi chưa có GMAIL_*: EmailServiceImpl in nội dung
    # mail (kèm link xác thực) ra log thay vì gọi Gmail API. Production phải để false,
    # nếu không mail xác thực/reset sẽ không bao giờ được gửi thật.
    dev-log: ${APP_MAIL_DEV_LOG:false}
    # Gmail API qua HTTPS: Render free tier chặn SMTP 25/465/587, Resend test mode chỉ giao
    # thư cho chủ tài khoản (xem spec/features/registration-email.md)
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
    # MAIL_FROM phải đúng là hộp thư đã cấp refresh token (Gmail không cho spoof From qua API)
    from: ${MAIL_FROM:}
    token-uri: ${GMAIL_TOKEN_URI:https://oauth2.googleapis.com/token}
    api-base-url: ${GMAIL_API_BASE_URL:https://gmail.googleapis.com}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000
    refresh-expiration: 604800000
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Cào JD IT TopCV bằng một nút bấm: URL danh sách mặc định + giới hạn mỗi lần.
  # Có thể override bằng env khi deploy. Proxy/cookie dùng khi TopCV chặn IP server.
  topcv:
    it-listing-url: ${TOPCV_IT_LISTING_URL:https://www.topcv.vn/tim-viec-lam-cong-nghe-thong-tin-cr257?type_keyword=1&disable_auto_detect_type_keyword=1&sba=1&category_family=r257&saturday_status=0}
    itviec-listing-url: ${ITVIEC_IT_LISTING_URL:https://itviec.com/it-jobs}
    default-limit: ${TOPCV_IMPORT_LIMIT:10}
    proxy-url: ${TOPCV_PROXY_URL:}
    cookie: ${TOPCV_COOKIE:}
    # Dịch vụ scraping có xử lý Cloudflare; {url} được thay bằng link cần tải (đã encode).
    # Ví dụ: https://api.scraperapi.com/?api_key=KEY&url={url}
    scraper-api-url: ${TOPCV_SCRAPER_API_URL:}
    user-agent: ${TOPCV_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36}
  # FR-SCH-03: nhắc lịch phỏng vấn. Mặc định tắt vì job gửi Gmail thật; bật bằng
  # INTERVIEW_REMINDER_ENABLED=true. window-minutes phải khớp nhịp cron bên dưới.
  interview-reminder:
    enabled: ${INTERVIEW_REMINDER_ENABLED:false}
    cron: ${INTERVIEW_REMINDER_CRON:0 */15 * * * *}
    window-minutes: ${INTERVIEW_REMINDER_WINDOW_MINUTES:15}
    lead-minutes: ${INTERVIEW_REMINDER_LEAD_MINUTES:60}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay/return}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payment/vnpay/ipn}
    version: ${VNPAY_VERSION:2.1.0}
    command: ${VNPAY_COMMAND:pay}
    order-type: ${VNPAY_ORDER_TYPE:other}
    locale: ${VNPAY_LOCALE:vn}
    currency: ${VNPAY_CURRENCY:VND}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
  zalopay:
    app-id: ${ZALOPAY_APP_ID:554}
    key1: ${ZALOPAY_KEY1:8NdU5pG5R2spGHGhyO99HN1OhD8IQJBn}
    key2: ${ZALOPAY_KEY2:uUfsWgfLkRLzq6W2uNXTCxrfxs51auny}
    create-url: ${ZALOPAY_CREATE_URL:https://sb-openapi.zalopay.vn/v2/create}
    query-url: ${ZALOPAY_QUERY_URL:https://sb-openapi.zalopay.vn/v2/query}
    callback-url: ${ZALOPAY_CALLBACK_URL:http://localhost:8080/api/v1/payment/zalopay/callback}
    redirect-url: ${ZALOPAY_REDIRECT_URL:http://localhost:3000/payment/zalopay/result}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI Configuration
ai:
  provider: ${AI_PROVIDER:openai}
  api-key: ${OPENAI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-4o-mini}
  eval-model: ${AI_EVAL_MODEL:gpt-4o-mini}
  whisper-model: whisper-1
  tts-model: tts-1
  tts-voice: alloy
  max-tokens: 4096
  temperature: 0.3

# File Storage
storage:
  cv-upload-dir: ${CV_UPLOAD_DIR:./uploads/cv}
  audio-upload-dir: ${AUDIO_UPLOAD_DIR:./uploads/audio}
  max-file-size: 10MB
  allowed-file-types: application/pdf,text/plain

# Interview Defaults
interview:
  default-question-count: 20
  max-question-count: 100
  min-question-count: 5
  default-time-limit-minutes: 60
  difficulty-distribution:
    beginner: 20
    intermediate: 50
    advanced: 30

# Study Program
study:
  max-topics-per-program: 10
  questions-per-topic: 10
  auto-generate-on-cv-upload: true
  question-language: en
  # Question pool: chi goi AI cho phan con thieu, moi lan sinh them mot batch
  question-pool:
    refill-batch: 20
    ceiling: 200
